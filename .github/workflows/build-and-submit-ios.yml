name: Build & Submit iOS App

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch chứa source iOS (mặc định: feat/ios)'
        type: string
        required: false
        default: 'feat/ios'
      build_profile:
        description: 'EAS build profile (production / preview)'
        type: choice
        options:
          - production
          - preview
        required: true
        default: 'preview'
      auto_submit:
        description: 'Automatically upload to TestFlight after build?'
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: Build & Upload iOS App
    # macos-15 + Xcode 16.x: compatible with Expo SDK 52 / RN 0.76
    # macos-26 (Xcode 26/Clang 26) breaks fmt/glog compile (consteval strict mode)
    runs-on: macos-15

    steps:
      # ── 1. Checkout source từ feat/ios (không phải main) ────────────────────
      - name: Checkout iOS source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch || 'feat/ios' }}

      # ── 2. Node.js ──────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      # ── 3. Xcode stable (16.x) — tránh Clang 26 consteval errors ───────────
      - name: Select Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Print build environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          node --version
          yarn --version

      # ── 4. EAS CLI ──────────────────────────────────────────────────────────
      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # ── 5. JS dependencies ──────────────────────────────────────────────────
      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      # ── 6. Build ─────────────────────────────────────────────────────────────
      - name: Build iOS App (local EAS build)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build \
            --platform ios \
            --profile ${{ inputs.build_profile || 'production' }} \
            --local \
            --output=StudyPeak.ipa \
            --non-interactive

      # ── 7. Save IPA as artifact ──────────────────────────────────────────────
      - name: Save IPA Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: StudyPeak-iOS-v${{ github.run_number }}
          path: StudyPeak.ipa
          retention-days: 14

      # ── 8. Upload to TestFlight ───────────────────────────────────────────────
      - name: Upload to TestFlight
        if: ${{ inputs.auto_submit }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          EXPO_APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          echo "Uploading StudyPeak.ipa to TestFlight via eas submit..."
          npx eas-cli submit \
            --platform ios \
            --profile ${{ inputs.build_profile || 'production' }} \
            --path StudyPeak.ipa \
            --non-interactive
